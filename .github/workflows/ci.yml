name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui:
    name: UI (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build

  php-lint:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, zip
      - name: Lint all PHP sources
        run: find src database tools -name '*.php' -print0 | xargs -0 -n1 php -l
